<div class="content-container">
  <form (ngSubmit)="salvar()" #clienteForm="ngForm">
    <h1>Cadastro de Cliente</h1>

    <p class="descricao">Preencha os dados abaixo para criar seu cadastro.</p>

    @if(clienteID) {
      <label for="id">ID:</label>
      <input type="text" id="id" name="id" [(ngModel)]="cliente.id" disabled/>
    }
    <label for="cpf">CPF</label>
    <input
      class="input-simples"
      id="cpf"
      name="cpf"
      type="text"
      placeholder="Digite seu CPF"
      [(ngModel)]="cliente.cpf"
      required
    />

    <label for="nome">Nome</label>
    <input
      class="input-simples"
      id="nome"
      name="nome"
      type="text"
      placeholder="Digite seu nome"
      [(ngModel)]="cliente.nome"
      required
    />

    <label for="sobrenome">Sobrenome</label>
    <input
      class="input-simples"
      id="sobrenome"
      name="sobrenome"
      type="text"
      placeholder="Digite seu sobrenome"
      [(ngModel)]="cliente.sobrenome"
      required
    />

    <label for="dataNascimento">Data de Nascimento</label>
    <input
      class="input-simples"
      id="dataNascimento"
      name="dataNascimento"
      type="date"
      [(ngModel)]="cliente.dataNascimento"
      required
    />

    <label for="email">Email</label>
    <input
      class="input-simples"
      id="email"
      name="email"
      type="email"
      placeholder="Digite seu email"
      [(ngModel)]="cliente.email"
      required
    />

    <label for="senha">Senha</label>
    <input
      class="input-simples"
      id="senha"
      name="senha"
      type="password"
      placeholder="Digite sua senha"
      [(ngModel)]="senha"
      required
    />

    <label for="confirmarSenha">Confirmar Senha</label>
    <input
      class="input-simples"
      id="confirmarSenha"
      name="confirmarSenha"
      type="password"
      placeholder="Confirme sua senha"
      [(ngModel)]="confirmarSenha"
      required
    />

    <button type="submit" class="input-submeter">Cadastrar</button>
  </form>
</div>
